<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCV-AI | Inteligencia Artificial</title>
<style>
body{font-family:Arial;background:#0a0e27;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
header{background:#021024;padding:15px;text-align:center}
h1{margin:0;color:#00d4ff}
#charlar{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.mensaje{padding:12px 15px;border-radius:18px;max-width:80%}
.usuario{background:#00d4ff;color:#000;align-self:flex-end}
.bot{background:#1e3a5f;align-self:flex-start}
#inputArea{display:flex;padding:10px;background:#021024}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
button{margin-left:10px;padding:12px 20px;border-radius:20px;border:none;background:#00d4ff;font-weight:bold}
</style>
</head>
<body>
<header><h1>JCV-AI</h1><p>Creado por Jose C Valadez 1979</p></header>
<div id="charlar">
<div class="mensaje bot">Hola Presidente! Soy JCV-AI, su Inteligencia Artificial. ¿En qué le ayudo hoy?</div>
</div>
<div id="inputArea">
<input id="entrada" placeholder="Escriba su mensaje...">
<button onclick="enviar()">Enviar</button>
</div>
<script>
function enviar(){
let input=document.getElementById('entrada');
let texto=input.value;
if(!texto)return;
let chat=document.getElementById('charlar');
chat.innerHTML+=`<div class="mensaje usuario">${texto}</div>`;
input.value='';
setTimeout(()=>{
chat.innerHTML+=`<div class="mensaje bot">JCV-AI procesando: "${texto}". ¡Sistema JCV-AI activo y trabajando para usted, Presidente!</div>`;
chat.scrollTop=chat.scrollHeight;
},500);
chat.scrollTop=chat.scrollHeight;
}
document.getElementById('entrada').addEventListener('keypress',function(e){if(e.key==='Enter')enviar();});
</script>
</body>
</html>
